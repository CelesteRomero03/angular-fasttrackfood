
<div class="container mt-4 mt-md-5 px-3 px-md-4">

  <h2 class="cart-title mb-4">
    <i class="fa-solid fa-cart-shopping"></i>
    Mi Carrito
  </h2>


  @for(item of carrito; track item.id) {

    <div class="cart-item">

      <!-- PRODUCTO -->
      <div class="cart-product">

        <h4 class="mb-2">
          {{ item.name }}
        </h4>

        <h5 class="mb-0">
          ${{ item.price * item.quantify }}
        </h5>

      </div>


      <!-- CONTROLES -->
      <div class="controls">

        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="disminuir(item.id)">
          -
        </button>

        <span>
          {{ item.quantify }}
        </span>

        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="aumentar(item.id)">
          +
        </button>

      </div>


      <!-- ELIMINAR -->
      <button
        type="button"
        class="btn-eliminar"
        (click)="eliminar(item.id)">

        🗑 Eliminar

      </button>

    </div>

  }


  <!-- TOTAL -->

  <div class="cart-total">

    <h3 class="mb-0">
      Total: ${{ total }}
    </h3>

  </div>


  <!-- CHECKOUT -->

  <button
    class="btn-checkout"
    routerLink="/checkout">

    Continuar Compra

  </button>

</div>
