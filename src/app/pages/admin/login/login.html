<div class="login-container">

  <div class="login-card">

    <div class="text-center mb-4">

      <h1>🍕Fast Track Food</h1>

      <p class="subtitle">
        Panel de Administración
      </p>

    </div>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="ingresar()">

      <div class="mb-3">

        <label class="form-label">
          Email
        </label>

        <input
          type="email"
          class="form-control"
          placeholder="Ingrese email"
          formControlName="email">

      </div>

      <div class="mb-4">

        <label class="form-label">
          Contraseña
        </label>

        <input
          type="password"
          class="form-control"
          placeholder="Ingrese contraseña"
          formControlName="password">

      </div>

      <button
        class="btn-login"
        type="submit">

        🔐 Ingresar

      </button>

    </form>

  </div>

</div>
