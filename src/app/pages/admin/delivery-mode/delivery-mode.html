<div class="container py-4">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
        <h2 class="mb-3 mb-md-0">🚚 Modos de Entrega</h2>
    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>
                            <th>Modo</th>
                            <th>Estado</th>
                            <th class="text-center">Acción</th>
                        </tr>

                    </thead>

                    <tbody>

                        @for(modo of modos; track modo.id){

                        <tr>

                            <td>
                                @if(modo.mode === 'delivery'){
                                    🚚 Envío a domicilio
                                }
                                @else if(modo.mode === 'take_away'){
                                    🛍️ Take Away
                                }
                                @else{
                                    🍽️ Consumo en local
                                }
                            </td>

                            <td>
                                @if(modo.isActive){
                                    <span class="badge bg-success">Activo</span>
                                }
                                @else{
                                    <span class="badge bg-danger">Inactivo</span>
                                }
                            </td>

                            <td class="text-center">

                                <button
                                    class="btn btn-sm w-100 w-md-auto"
                                    [class.btn-danger]="modo.isActive"
                                    [class.btn-success]="!modo.isActive"
                                    (click)="cambiarEstado(modo)">

                                    @if(modo.isActive){
                                        Desactivar
                                    }
                                    @else{
                                        Activar
                                    }

                                </button>

                            </td>

                        </tr>

                        }

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
